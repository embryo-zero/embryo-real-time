<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embryo Meet</title>
<style>
:root { --bg:#f4f5f7; --card:#fff; --ink:#15171a; --muted:#5d6470; --line:#d9dde3; --accent:#2f6fe4; --bad:#c8372d; --tile:#1d2026; }
@media (prefers-color-scheme: dark) { :root { --bg:#111317; --card:#1a1d22; --ink:#eceef1; --muted:#9aa2ad; --line:#2c3138; --accent:#5b8ff0; --bad:#e2574c; --tile:#000; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
header { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--card); }
header h1 { font-size:17px; margin:0; }
header .st { margin-left:auto; color:var(--muted); font-size:13px; }
main { padding:16px; max-width:1200px; margin:0 auto; }
.join { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; max-width:420px; margin:24px auto; display:grid; gap:10px; }
label { font-size:13px; color:var(--muted); display:grid; gap:4px; }
input { font:inherit; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); }
button { font:inherit; padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
button.go { background:var(--accent); border-color:var(--accent); color:#fff; }
button.off { background:var(--bad); border-color:var(--bad); color:#fff; }
#grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; }
.tile { position:relative; background:var(--tile); border-radius:10px; overflow:hidden; aspect-ratio:16/10; }
.tile video { width:100%; height:100%; object-fit:cover; }
.tile .nm { position:absolute; left:8px; bottom:8px; background:rgba(0,0,0,.55); color:#fff; font-size:12px; padding:2px 8px; border-radius:6px; }
.tile.talk { outline:3px solid var(--accent); }
.bar { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:14px 0; }
.msg { color:var(--bad); font-size:13px; min-height:1em; }
footer { text-align:right; font-size:11px; color:var(--muted); padding:8px 16px; }
footer a { color:inherit; }
[hidden] { display:none !important; }
</style>
</head>
<body>
<header><h1>📹 Embryo Meet</h1><span class="st" id="st">Not in a room</span></header>
<main>
  <form class="join" id="join">
    <label>Room<input id="room" value="Embryo Team" maxlength="40"></label>
    <label>Your name<input id="name" maxlength="40" placeholder="Angel"></label>
    <button class="go" type="submit">Join with camera and microphone</button>
    <div class="msg" id="msg"></div>
  </form>
  <section id="call" hidden>
    <div id="grid"></div>
    <div class="bar">
      <button id="mic">🎙️ Mic on</button>
      <button id="cam">📷 Camera on</button>
      <button id="scr">🖥️ Share screen</button>
      <button id="leave" class="off">Leave</button>
    </div>
  </section>
</main>
<footer>Embryo Meet · based on LiveKit (Apache-2.0) · <a href="https://github.com/embryo-zero/embryo-real-time" target="_blank" rel="noopener">source</a></footer>
<script src="vendor/livekit-client.umd.js"></script>
<script>
const LK = window.LivekitClient, $ = id => document.getElementById(id);
let room = null;
try { $("name").value = localStorage.getItem("meet.name") || ""; } catch (e) {}

function tile(id, name) {
  let t = document.querySelector(`[data-id="${CSS.escape(id)}"]`);
  if (!t) { t = document.createElement("div"); t.className = "tile"; t.dataset.id = id;
            t.innerHTML = `<div class="nm"></div>`; $("grid").appendChild(t); }
  t.querySelector(".nm").textContent = name || id;
  return t;
}
function attach(track, p) {
  const me = room && p === room.localParticipant;
  const t = tile(p.identity + (track.source === "screen_share" ? ":screen" : ""), (p.name || p.identity) + (me ? " (you)" : "") + (track.source === "screen_share" ? " (screen)" : ""));
  const el = track.attach();
  if (track.kind === "video") { t.querySelectorAll("video").forEach(v => v.remove()); el.muted = true; el.playsInline = true; t.prepend(el); }
  else { el.hidden = true; t.appendChild(el); }
}
function drop(p) { document.querySelectorAll(`[data-id^="${CSS.escape(p.identity)}"]`).forEach(t => t.remove()); }
function status() { $("st").textContent = room ? `${room.name} · ${room.numParticipants || room.remoteParticipants.size + 1} in the room` : "Not in a room"; }

$("join").onsubmit = async ev => {
  ev.preventDefault(); $("msg").textContent = "";
  const name = $("name").value.trim() || "Guest";
  try { localStorage.setItem("meet.name", name); } catch (e) {}
  try {
    const r = await (await fetch("ticket", { method: "POST", headers: { "Content-Type": "application/json" },
                     body: JSON.stringify({ room: $("room").value, name }) })).json();
    if (!r.ok) { $("msg").textContent = r.error; return; }
    room = new LK.Room({ adaptiveStream: true, dynacast: true });
    room.on(LK.RoomEvent.TrackSubscribed, (track, pub, p) => attach(track, p))
        .on(LK.RoomEvent.TrackUnsubscribed, track => track.detach().forEach(e => e.remove()))
        .on(LK.RoomEvent.LocalTrackPublished, pub => { if (pub.track.kind === "video") attach(pub.track, room.localParticipant); })
        .on(LK.RoomEvent.ParticipantConnected, p => { tile(p.identity, p.name); status(); })
        .on(LK.RoomEvent.ParticipantDisconnected, p => { drop(p); status(); })
        .on(LK.RoomEvent.ActiveSpeakersChanged, sp => document.querySelectorAll(".tile").forEach(t =>
              t.classList.toggle("talk", sp.some(s => s.identity === t.dataset.id))))
        .on(LK.RoomEvent.Disconnected, () => leave());
    const wsUrl = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + location.pathname.replace(/\/[^/]*$/, "");
    await room.connect(wsUrl, r.token);
    tile(room.localParticipant.identity, name + " (you)");
    room.remoteParticipants.forEach(p => tile(p.identity, p.name));
    $("join").hidden = true; $("call").hidden = false; status();
    try { await room.localParticipant.enableCameraAndMicrophone(); }
    catch (e) { $("msg").textContent = "Camera/microphone: " + e.message; }
  } catch (e) { $("msg").textContent = "Could not join: " + e.message; room = null; }
};
function leave() { if (room) { const r = room; room = null; r.disconnect(); } $("grid").innerHTML = ""; $("call").hidden = true; $("join").hidden = false; status(); }
$("leave").onclick = leave;
$("mic").onclick = async () => { const on = !room.localParticipant.isMicrophoneEnabled; await room.localParticipant.setMicrophoneEnabled(on); $("mic").textContent = on ? "🎙️ Mic on" : "🔇 Mic off"; $("mic").classList.toggle("off", !on); };
$("cam").onclick = async () => { const on = !room.localParticipant.isCameraEnabled; await room.localParticipant.setCameraEnabled(on); $("cam").textContent = on ? "📷 Camera on" : "🚫 Camera off"; $("cam").classList.toggle("off", !on); };
$("scr").onclick = async () => { const on = !room.localParticipant.isScreenShareEnabled; try { await room.localParticipant.setScreenShareEnabled(on); $("scr").textContent = on ? "🖥️ Stop sharing" : "🖥️ Share screen"; } catch (e) {} };
</script>
</body>
</html>
